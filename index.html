async function scheduleReminders(){
 const LN=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
 if(!LN||S.remindOn===false)return;
 try{
  const perm=await LN.requestPermissions();
  const ok=perm&&(perm.display==="granted"||perm.granted===true);
  if(!ok)return;
  try{await LN.createChannel({id:"baobei-med",name:"吃药提醒",description:"孕期用药与补充剂",importance:5,visibility:1,vibration:true})}catch(e){}
  const pending=await LN.getPending();
  const old=((pending&&pending.notifications)||[]).filter(n=>n.id>=1000&&n.id<2000).map(n=>({id:n.id}));
  if(old.length)await LN.cancel({notifications:old});
  const list=S.meds.filter(m=>m.at&&m.remind!==false);
  if(!list.length)return;
  const notifications=list.map((m,i)=>{const p=(m.at||"08:00").split(":"),hh=+p[0]||8,mm=+p[1]||0;return{id:1000+i,title:"宝贝守护 · 吃药提醒",body:"该吃「"+m.n+"」了"+(m.dose?"（"+m.dose+"）":""),schedule:{on:{hour:hh,minute:mm},allowWhileIdle:true},channelId:"baobei-med",extra:{mid:String(m.id)}}});
  await LN.schedule({notifications});
 }catch(e){}}
async function enableReminders(){S.remindOn=true;save();await scheduleReminders();toast("已开启吃药提醒");render(true)}
const icsEsc=s=>String(s).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");
function shareMedsIcs(){
  const list=S.meds.filter(m=>m.at&&m.remind!==false);
  if(!list.length){toast("先给药物填上每天的提醒时间");return}
  const now=new Date();
  const events=list.map(m=>{
    const p=(m.at||"08:00").split(":"),hh=+p[0]||0,mm=+p[1]||0;
    const passed=now.getHours()>hh||(now.getHours()===hh&&now.getMinutes()>=mm);
    const start=(passed?plus(today(),1):today()).replace(/-/g,"")+"T"+String(hh).padStart(2,"0")+String(mm).padStart(2,"0")+"00";
    return `BEGIN:VEVENT\nUID:${m.id}@baobei\nDTSTART:${start}\nRRULE:FREQ=DAILY\nSUMMARY:${icsEsc("宝贝守护 · "+m.n)}\nDESCRIPTION:${icsEsc("该吃"+m.n+(m.dose?"（"+m.dose+"）":""))}\nBEGIN:VALARM\nTRIGGER:PT0S\nACTION:DISPLAY\nDESCRIPTION:${icsEsc("该吃"+m.n)}\nEND:VALARM\nEND:VEVENT`;
  }).join("\n");
  const ics=`BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//baobei//cn//\nCALSCALE:GREGORIAN\n${events}\nEND:VCALENDAR\n`;
  const file=new File([ics],"宝贝守护吃药提醒.ics",{type:"text/calendar"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"吃药提醒"}).catch(e=>{if(!e||e.name!=="AbortError")downloadBlob(new Blob([ics],{type:"text/calendar"}),"宝贝守护吃药提醒.ics")});return}
  downloadBlob(new Blob([ics],{type:"text/calendar"}),"宝贝守护吃药提醒.ics");
  toast("已生成日历文件，打开后添加到日历");
}

function sheetNote(){const K=["日常","产检","化验报告","其他"];sheet("记今天的事",`${dayTag()}<p class="sub">写清楚当天发生了什么。化验单、超声或聊天记录，用截图放进来即可。</p><div class="chips">${K.map(k=>`<span class="chip ${nd.kind==k?"on":""}" onclick="nd.kind='${k}';sheetNote()">${k}</span>`).join("")}</div><label class="l">标题</label><input value="${esc(nd.title)}" placeholder="例如 大排畸报告、今天的胎动" oninput="nd.title=this.value"><label class="l">描述</label><textarea rows="4" placeholder="医生原话、报告上的结论，或今天发生的事" oninput="nd.text=this.value">${esc(nd.text)}</textarea><label class="photo" style="margin-top:12px"><input type="file" accept="image/*" multiple onchange="pickNoteImg(this)">📷 拍照、相册或截图</label><div class="thumbs">${nd.imgs.map((s,i)=>`<img src="${s}" onclick="nd.imgs.splice(${i},1);sheetNote()">`).join("")}</div><p class="sub">最多 6 张。点缩略图可去掉。保存后到「记录」里按日期回看。</p><button class="btn big" onclick="saveNote()">保存到这一天</button>`)}
async function pickNoteImg(inp){const files=[...inp.files].slice(0,6-nd.imgs.length);inp.value="";if(!files.length)return;imgBusy=true;let fail=0;for(const f of files){const d=await comp(f);if(d)nd.imgs.push(d);else fail++}imgBusy=false;sheetNote();if(fail)toast(fail+" 张照片读不出来，请再拍一次或从相册选 JPG/PNG")}
function saveNote(){if(imgBusy){toast("照片还在处理，稍等一下");return}const title=(nd.title||"").trim(),text=(nd.text||"").trim();if(!title&&!text&&!nd.imgs.length){toast("写一点描述，或放一张截图");return}S.notes=S.notes||[];S.notes.push({id:Date.now(),d:ctxDay(),t:ctxDay()==today()?nowT():"12:00",kind:nd.kind||"日常",title,text,imgs:nd.imgs.slice()});if(!save()){S.notes.pop();alert("本机存储空间不足，照片未能保存，可以先删除较早的记录。");return}nd={kind:"日常",title:"",text:"",imgs:[]};closeSheet();toast("已按日期归档");render(true)}
function delNote(id){if(!confirm("删除这条记事和里面的照片？"))return;S.notes=(S.notes||[]).filter(x=>x.id!=id);save();render(true)}
function delFood(id){if(confirm("删除这一餐？")){F=F.filter(x=>x.id!=id);saveF();render(true)}}
function showImg(s){const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:40";d.innerHTML=`<img src="${s}" style="max-width:96%;max-height:90%;border-radius:14px">`;d.onclick=()=>d.remove();document.body.appendChild(d)}
const SEGS=[["weight","体重"],["kick","胎动"],["bp","血压"],["lab","血化验"],["pro","蛋白质"],["mood","心情"],["preg","孕周日历"]];
V.trend=()=>{let body="";const lst=(arr,key,fmt)=>`<div style="margin-top:8px">${arr.slice().reverse().slice(0,6).map(x=>`<div class="row" style="padding:7px 0;border-top:1px solid var(--line)"><span class="sub">${x.d}</span><b>${fmt(x)}</b><button class="btn ghost sm sp" onclick="delItem('${key}',${x.i})">删除</button></div>`).join("")}</div>`;
 const idx=a=>sorted(a.map((x,i)=>({...x,i})));
 if(seg=="weight"){const W=sorted(S.logs).filter(x=>x.w>0);body=`<div class="card"><h2>体重</h2>${chart(W.map(x=>({d:x.d,v:x.w})),"v")}<p class="sub">孕期体重增加因人而异，以产科建议为准。</p><button class="btn soft" style="margin-top:10px" onclick="sheetW()">记体重</button></div>`}
 else if(seg=="kick"){const a=sorted(S.kicks.map(x=>({d:x.d,v:x.n})));body=`<div class="card"><h2>胎动次数</h2>${chart(a,"v")}<button class="btn soft" style="margin-top:10px" onclick="sheetKick()">数胎动</button></div>`}
 else if(seg=="bp"){const a=idx(S.bp);body=`<div class="card"><h2>血压（收缩压）</h2>${chart(a,"sys")}<p class="sub">同时记录舒张压。以医院测量和医生判断为准。</p>${lst(a,"bp" ,x=>x.sys+"/"+x.dia)}<button class="btn soft" style="margin-top:10px" onclick="sheetBP()">记血压</button></div>`}
 else if(seg=="lab"){const a=idx(S.labs).filter(x=>x.k==labk),r=LAB[labk],groups=sorted(S.bloods).slice().reverse().slice(0,5);
 body=`<div class="card"><h2>血化验趋势</h2><select onchange="labk=this.value;render(true)">${Object.keys(LAB).map(k=>`<option ${k==labk?"selected":""}>${k}</option>`).join("")}</select><div style="margin-top:8px">${chart(a,"v")}</div><p class="sub">常见参考 ${r[1]}–${r[2]} ${r[0]}，孕期范围因孕周和医院而异，以报告为准。</p>${lst(a,"labs",x=>x.v+(labFlag(labk,x.v)?" · "+labFlag(labk,x.v):""))}<button class="btn soft" style="margin-top:10px" onclick="sheetBlood()">录入一组血检</button></div>
 ${groups.map(b=>`<div class="card"><div class="row"><h2 style="margin:0">${b.d}</h2><button class="btn ghost sm sp" onclick="delBlood(${b.id})">删除</button></div><p class="sub">${esc(b.hosp||"抽血")}${b.note?" · "+esc(b.note):""}</p>${b.items.map(i=>`<div class="row" style="padding:4px 0"><span>${esc(i.k)}</span><b class="sp">${i.v} ${LAB[i.k]?LAB[i.k][0]:""}${labFlag(i.k,i.v)?" · "+labFlag(i.k,i.v):""}</b></div>`).join("")}</div>`).join("")}`}
 else if(seg=="pro"){const a=Array.from({length:14},(_,i)=>addDays(i-13)).map(d=>({d,v:proOf(d)})).filter(x=>x.v>0);body=`<div class="card"><h2>蛋白质（克/天）</h2>${chart(a,"v")}<p class="sub">参考起点约 ${refPro()} 克（体重×1.1），孕中晚期需要通常更高，请营养科定。</p></div>`}
 else if(seg=="mood"){const a=sorted(S.logs).filter(x=>x.mood!=null).slice(-14).map(x=>({d:x.d,v:x.mood/2}));body=`<div class="card"><h2>心情（1–5）</h2>${chart(a,"v")}</div>`}
 else{body=cal()}
 return `<div class="hd"><h1>趋势</h1><p>看变化，方便产检时带给医生</p></div><div class="seg">${SEGS.map(s=>`<span class="chip ${seg==s[0]?"on":""}" onclick="seg='${s[0]}';render(true)">${s[1]}</span>`).join("")}</div>${body}`};
function delItem(k,i){if(!confirm("删除这条记录？"))return;S[k].splice(i,1);save();render(true)}
function cal(){const p=preg(),n=new Date(),m0=new Date(Date.UTC(n.getFullYear(),n.getMonth()+cm,1)),ym=m0.getUTCFullYear()+"-"+String(m0.getUTCMonth()+1).padStart(2,"0"),off=m0.getUTCDay(),dim=new Date(Date.UTC(m0.getUTCFullYear(),m0.getUTCMonth()+1,0)).getUTCDate(),due=dueOf(),lmp=(S.preg||{}).lmp,ev=new Set([...S.exams,...S.labs,...S.appt].map(x=>x.d));
 let h=WK.map(x=>`<div class="h">${x}</div>`).join("")+"<div></div>".repeat(off);
 for(let i=1;i<=dim;i++){const d=ym+"-"+String(i).padStart(2,"0"),k=["c"];if(d==today())k.push("p");if(due&&d==due)k.push("o");if(lmp&&diff(lmp,d)%7==0&&diff(lmp,d)>=0&&(!due||d<=due))k.push("f");if(ev.has(d))k.push("ev");if(d==selD)k.push("sel");h+=`<div class="${k.join(" ")}" onclick="selD='${d}';render(true)">${i}</div>`}
 const onSel=S.appt.filter(a=>a.d==selD),ex=S.exams.filter(e=>e.d==selD);
 return `<div class="card"><h2>${p.t}</h2><p class="sub" style="margin-top:-6px">${p.s}</p><div class="row" style="justify-content:space-between;margin-bottom:8px"><button class="btn ghost sm" onclick="cm--;render(true)">‹</button><b>${ym}</b><button class="btn ghost sm" onclick="cm++;render(true)">›</button></div><div class="cal">${h}</div>
 <div class="lg"><span><i style="background:var(--rose2)"></i>今天</span><span><i style="background:var(--sage2)"></i>整孕周</span><span><i style="background:var(--sage)"></i>预产期</span><span><i style="background:var(--amb);border-radius:50%"></i>产检/化验</span></div>
 <button class="btn soft" style="margin-top:10px" onclick="sheetPreg()">修改预产期</button></div>
 <div class="card"><h2>${selD}</h2>${onSel.map(a=>`<p>📅 ${esc(a.t)}</p>`).join("")}${ex.map(e=>`<p>🧪 ${esc(e.t)}：${esc(e.r)}</p>`).join("")}${!onSel.length&&!ex.length?'<p class="sub">这天还没有产检记录</p>':""}<p class="sub">孕周按末次月经估算，超声校正后的预产期更准。</p></div>`}
const AC=(k,t,b)=>`<details class="acc" ${acc.has(k)?"open":""} ontoggle="this.open?acc.add('${k}'):acc.delete('${k}')"><summary>${t}</summary><div class="in">${b}</div></details>`;
V.me=()=>{const up=S.appt.filter(a=>a.d>=today()).sort((a,b)=>a.d<b.d?-1:1),on=rfOn,u=RF.filter((r,i)=>on(i)&&r[1]).length,dn=RF.filter((r,i)=>on(i)&&!r[1]).length,ph=preg(),w=ph.week,bagN=BAG.filter(x=>S.bag&&S.bag[x]).length,recent=sorted(S.doses).slice(-8).reverse();
 return `<div class="hd"><h1>我的</h1><p>用药、血检、提醒和导出都在这里</p></div>
 ${AC("pg","🤰 孕周与宝宝",`<p><b>${ph.t}</b></p><p class="sub">${ph.s}${ph.name?" · "+esc(ph.name):""}</p><button class="btn" onclick="sheetPreg()">填写 / 修改</button>`)}
 ${AC("plan","📅 产检时间轴",PLAN.map(([wk,t])=>`<div class="row" style="padding:7px 0;border-top:1px solid var(--line)"><span class="tag ${w!=null&&w>=wk?"g":""}">${wk}周</span><span style="flex:1">${t}</span>${w!=null&&w>=wk?"<span class='sub'>到点</span>":""}</div>`).join("")+`<p class="sub">仅作备忘，具体检查以产科安排为准。</p>`)}
 ${AC("med","💊 药物与吃药提醒",`${S.meds.map(m=>`<div class="item" onclick="sheetMed(${m.id})"><div style="flex:1"><div class="nm">${esc(m.n)}</div><div class="sub">${m.at?m.at+" 提醒 · ":""}${esc(m.t)}${m.dose?" · "+esc(m.dose):""}${m.remind===false?" · 不提醒":""}</div></div><span class="tag">${esc(m.c)}</span></div>`).join("")||'<p class="sub">暂无</p>'}<div class="row" style="margin-top:12px"><button class="btn" onclick="sheetMed()">＋ 添加药物</button><button class="btn soft" onclick="addVit()">一键叶酸/钙/铁</button></div><p class="sub">添加时自己写药名。导出文件含全部记录，可再导入回来。</p><div class="row"><button class="btn soft" onclick="backupData()">保存到文件</button><button class="btn soft" onclick="pickImport()">导入记录</button></div>${(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())?`<button class="btn big" onclick="enableReminders()">开启系统吃药提醒</button><p class="sub">保存带时间的药物后会每天推送。</p>`:`<button class="btn big" onclick="shareMedsIcs()">把吃药时间加到日历</button><p class="sub">iPhone 日历会到点提醒。打开宝贝守护也能看到今天吃了没有。</p>`}`)}
 ${AC("dose","📒 用药记录",`${recent.map(x=>`<div class="row" style="padding:6px 0"><div style="flex:1"><b>${esc(x.n)}</b><div class="sub">${x.d} ${x.t}${x.dose?" · "+esc(x.dose):""}${x.note?" · "+esc(x.note):""}</div></div><button class="btn ghost sm" onclick="delDose(${x.id})">删除</button></div>`).join("")||'<p class="sub">打卡或点“记一次药”会出现在这里</p>'}<button class="btn soft big" onclick="sheetDose()">＋ 记一次用药</button>`)}
 ${AC("bl","🩸 血化验记录",`${sorted(S.bloods).slice().reverse().slice(0,6).map(b=>`<div class="card" style="margin:8px 0;box-shadow:none"><div class="row"><b>${b.d}</b><button class="btn ghost sm sp" onclick="delBlood(${b.id})">删除</button></div><p class="sub">${esc(b.hosp||"")}${b.note?" · "+esc(b.note):""}</p>${b.items.map(i=>`<div class="row"><span>${esc(i.k)}</span><span class="sp">${i.v}${labFlag(i.k,i.v)?" · "+labFlag(i.k,i.v):""}</span></div>`).join("")}</div>`).join("")||'<p class="sub">把一次抽血的多项结果一起记下来</p>'}<button class="btn" onclick="sheetBlood()">＋ 录入血检</button>`)}
 ${AC("bag","🧳 待产包 "+bagN+"/"+BAG.length,`<button class="btn soft" onclick="sheetBag()">打开清单</button>`)}
 ${AC("ap","📅 产检预约",`${up.map(a=>`<div class="row" style="padding:7px 0"><div style="flex:1"><b>${esc(a.t)}</b><div class="sub">${a.d}</div></div><span class="tag g">${diff(today(),a.d)||"今"}天${diff(today(),a.d)?"后":""}</span><button class="btn ghost sm" onclick="S.appt=S.appt.filter(x=>x.id!=${a.id});save();render(true)">删除</button></div>`).join("")||'<p class="sub">暂无即将到来的预约</p>'}<div class="row" style="margin-top:10px"><input id="ad" type="date" style="flex:1"><input id="at" placeholder="项目，如 大排畸" style="flex:1.2"></div><button class="btn soft big" onclick="addAppt()">添加预约</button>`)}
 ${AC("in","⚠️ 过敏 / 不能吃的东西",`${S.intol.map((x,i)=>`<div class="row" style="padding:6px 0"><span style="flex:1">${esc(x)}</span><button class="btn ghost sm" onclick="S.intol.splice(${i},1);save();render(true)">删除</button></div>`).join("")||'<p class="sub">暂无</p>'}<div class="row" style="margin-top:8px"><input id="ii" placeholder="例如 海鲜：皮疹" style="flex:1"><button class="btn soft" onclick="addIntol()">添加</button></div>`)}
 ${AC("ai","✨ AI 整理",`<p class="sub" style="margin-top:0">根据你的记录整理趋势、要留意的点和产检时可问医生的问题。不做诊断，不推荐药物。</p><button class="btn" id="aib" onclick="runAI()">生成整理</button><div id="aio"></div>`)}
 ${AC("rf","🧭 孕期要点清单",`<p class="sub" style="margin-top:0">勾选当前适用的项目，方便告诉医生，不是预测。</p>${RF.map((r,i)=>`<div class="item ${on(i)?"done":""}" onclick="S.risk[${i}]=${!on(i)};save();render(true)"><div class="ck">${on(i)?"✓":""}</div><div style="flex:1">${r[0]}</div><span class="tag ${r[1]?"a":"g"}">${r[1]?"需告知医生":"常规"}</span></div>`).join("")}<p style="margin:10px 0 0">需告知 <b>${u}</b> 项 · 常规 <b>${dn}</b> 项</p>`)}
 ${AC("fam","👪 家人简报",`<pre id="fam">${esc(famTxt())}</pre><button class="btn big" onclick="shareFam()">分享给家人</button><p class="sub">给伴侣或家人看的文字简报。</p>`)}
 ${AC("sum","📄 产检摘要与 PDF",`<pre id="sum">${esc(sum())}</pre><div class="row" style="margin-top:10px"><button class="btn" onclick="copySum()">复制</button><button class="btn" onclick="exportPdf()">${(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())?"从 SQLite 导出 PDF":"复制报告全文"}</button></div><p class="sub">${(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())?"PDF 用本机记录生成，可分享到微信或保存到文件。":"会把报告复制出来，可粘贴到备忘录。完整记录用下面的备份。"}</p>`)}
 ${AC("dt","⚙️ 数据",bakPanel())}`};
function addAppt(){if(!$("ad").value||!$("at").value.trim()){toast("请填日期和项目");return}S.appt.push({id:Date.now(),d:$("ad").value,t:$("at").value.trim()});save();render(true)}
function addIntol(){const v=$("ii").value.trim();if(!v)return;S.intol.push(v);save();render(true)}
function labTxt(){return Object.keys(LAB).map(k=>{const a=sorted(S.labs.filter(x=>x.k==k)),z=a[a.length-1];return z?`${k} ${z.v}${LAB[k][0]}${labFlag(k,z.v)?"（"+labFlag(k,z.v)+"）":""} ${z.d}`:null}).filter(Boolean).join("；")||"暂无"}
function sum(){const L=sorted(S.logs).slice(-5),pr=preg();return `【产检摘要】生成日期 ${today()}\n\n■ 孕周\n${pr.t}；${pr.s}${pr.name?"；宝宝："+pr.name:""}\n\n■ 近期检查\n${sorted(S.exams).reverse().map(e=>`${e.d} ${e.t}：${e.r}`).join("\n")||"暂无"}\n\n■ 血化验\n${labTxt()}\n\n■ 血压\n${sorted(S.bp).slice(-5).map(x=>`${x.d} ${x.sys}/${x.dia}`).join("\n")||"暂无"}\n\n■ 当前药物 / 补充剂\n${S.meds.map(x=>`${x.n}（${x.c}，${x.t}${x.at?"，提醒 "+x.at:""}${x.dose?"，"+x.dose:""}）`).join("\n")||"暂无"}\n\n■ 过敏\n${S.intol.join("\n")||"暂无"}\n\n■ 预约\n${S.appt.map(a=>a.d+" "+a.t).join("\n")||"暂无"}\n\n■ 近期状态\n${L.map(x=>`${x.d} ${x.w?"体重"+x.w+"kg ":""}${x.sys?"血压"+x.sys+"/"+x.dia+" ":""}${x.pain!=null?"疼痛"+x.pain+" ":""}${x.mood!=null?"心情"+x.mood/2+"/5 ":""}${x.sym&&x.sym.length?x.sym.join("、"):""}`).join("\n")||"暂无"}\n\n■ 系统提醒\n${alerts().map(a=>a[1]).join("\n")||"无"}\n\n■ 想问医生\n1. \n2. `}
function famTxt(){const T=today(),A=alerts(),l=sorted(S.logs).filter(x=>x.w>0).pop(),a=S.appt.filter(x=>x.d>=T).sort((x,y)=>x.d<y.d?-1:1)[0],pr=preg(),kk=S.kicks.filter(x=>x.d==T).reduce((s,x)=>s+x.n,0);return `【${T} 宝贝守护简报】\n孕周：${pr.t}\n整体：${A.some(x=>x[0]=="alert")?"需要尽快联系医生":A.length?"有几项需要留意":"今天看起来还平稳"}\n今日补充剂：${S.meds.filter(m=>m.done[T]).length}/${S.meds.length} 已打卡\n今日蛋白质：${proOf(T)}/${refPro()} 克\n今日胎动：${kk||"还没记"} 次\n${l?`最近体重（${l.d}）：${l.w}kg`:"最近没有体重记录"}\n需要关注：${A.map(x=>x[1]).join("；")||"无"}\n下次产检：${a?a.d+" "+a.t:"暂无"}\n（来自宝贝守护，仅供家人了解，不代替医生意见）`}
async function shareFam(){const t=famTxt();try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e&&e.name=="AbortError")return}try{await navigator.clipboard.writeText(t);toast("已复制，可粘贴发给家人")}catch(e){const r=document.createRange();r.selectNodeContents($("fam"));const g=getSelection();g.removeAllRanges();g.addRange(r)}}
function copySum(){const t=sum();try{navigator.clipboard.writeText(t).then(()=>toast("已复制"),()=>{})}catch(e){const r=document.createRange();r.selectNodeContents($("sum"));const g=getSelection();g.removeAllRanges();g.addRange(r)}}
async function exportRpt(){let dl=null;try{dl=typeof claude!=="undefined"?await claude.use("downloads"):null}catch(e){}
 if(!dl){toast("当前环境不能保存文件，请用“复制”");return}
 const tb=(h,rows)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</table>`;
 const html=`<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>宝贝守护报告 ${today()}</title><style>body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:720px;margin:24px auto;padding:0 16px;color:#222}h1{font-size:22px}h2{font-size:16px;border-bottom:1px solid #ccc;padding-bottom:4px;margin-top:22px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid #ccc;padding:4px 8px;text-align:left}pre{white-space:pre-wrap;font-family:inherit;font-size:13px}p{font-size:12px;color:#666}</`+`style></head><body><h1>宝贝守护 · 产检摘要</h1><p>生成日期 ${today()}。以下为自行记录，仅供就诊参考。打开后用浏览器“打印”可另存为 PDF。</p><h2>孕周</h2><pre>${esc(preg().t+"；"+preg().s)}</pre><h2>检查</h2>${tb(["日期","项目","结论"],sorted(S.exams).map(x=>[x.d,x.t,x.r]))}<h2>化验</h2>${tb(["日期","项目","数值","标记"],sorted(S.labs).map(x=>[x.d,x.k,x.v,labFlag(x.k,x.v)]))}<h2>血压</h2>${tb(["日期","收缩压","舒张压"],sorted(S.bp).map(x=>[x.d,x.sys,x.dia]))}<h2>近14天状态</h2>${tb(["日期","体重","血压","疼痛","体力","食欲","心情","睡眠h","蛋白质g","症状"],sorted(S.logs).slice(-14).map(x=>[x.d,x.w||"",x.sys?x.sys+"/"+x.dia:"",x.pain!=null?x.pain:"",x.en||"",x.ap||"",x.mood||"",x.sl||"",proOf(x.d)||"",(x.sym||[]).join("、")]))}<h2>摘要</h2><pre>${esc(sum())}</pre></body></html>`;
 try{await dl.save({filename:"宝贝守护报告-"+today()+".html",data:html})}catch(e){if(!e||e.code!="declined")toast("保存失败")}}
async function runAI(){const o=$("aio"),b=$("aib");let sample=null;try{sample=typeof claude!=="undefined"?await claude.use("sample"):null}catch(e){}
 if(!sample){o.innerHTML='<pre style="margin-top:10px">当前环境不支持 AI 整理。</pre>';return}
 b.disabled=true;o.innerHTML='<pre style="margin-top:10px">正在整理…</pre>';
 const pr=preg();
 const data={pregnancy:pr,exams:S.exams,labs:S.labs,bp:S.bp,appointments:S.appt,meds:S.meds.map(m=>({n:m.n,c:m.c,t:m.t,takenDays:Object.keys(m.done).slice(-7)})),intolerance:S.intol,logs:sorted(S.logs).slice(-14),kicks:S.kicks.filter(x=>x.d>=addDays(-7)),meals:F.filter(x=>x.d>=addDays(-7)).map(x=>({d:x.d,meal:x.meal,foods:x.foods,txt:x.txt,pro:x.pro})),ruleAlerts:alerts().map(a=>a[1]),notesChecked:RF.filter((r,i)=>rfOn(i)).map(r=>r[0])};
 const q='你是孕期自我管理工具里的整理助手。下面是孕妇自己记录的数据（JSON）。请用中文、通俗、温和的语言输出，且只输出 JSON：{"trend":"3句以内的趋势概述","watch":["需要留意的点，最多4条"],"ask_doctor":["产检时可问医生的问题，最多5条"],"care_notes":["补充剂、饮食、胎动、睡眠方面的观察，最多3条"]}。严格规则：不下诊断，不预测胎儿性别或健康结局，不推荐具体药物、剂量或停药换药；数据不足时直说；出现出血、剧痛、胎动减少、视物模糊、严重头痛时提醒尽快就医；情绪连续低落时温和建议寻求支持；所有结论都提醒由产科医生判断。\n数据：'+JSON.stringify(data);
 try{const r=await sample.json(q,{cache:false}),L=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join("");
  o.innerHTML=`<div style="background:var(--lav2);border-radius:16px;padding:12px;margin-top:10px;font-size:14px"><b>趋势</b><p style="margin:2px 0 8px">${esc(r.trend||"")}</p><b>需要留意</b><ul>${L(r.watch)}</ul><b>想问医生</b><ul>${L(r.ask_doctor)}</ul><b>日常观察</b><ul>${L(r.care_notes)}</ul><p class="sub">由 AI 根据你的记录整理，可能有误，请以医生判断为准。</p></div>`}
 catch(e){o.innerHTML='<pre style="margin-top:10px">'+(e&&e.code=="not_granted"?"未授权使用 AI。":"生成失败，请稍后再试。")+'</pre>'}b.disabled=false}
function resetDemo(){if(confirm("将清除现有记录（含饮食照片）并恢复示例数据，继续吗？")){S=demo();F=[];save();saveF();scheduleReminders();render()}}
function bakMeta(){try{return JSON.parse(lsGet(LS+"_bak")||"{}")}catch(e){return{}}}
function setBakMeta(m){lsSet(LS+"_bak",JSON.stringify(m))}
function backupEvery(){const n=bakMeta().every;return n==null?3:n}
function backupDue(){const m=bakMeta(),every=backupEvery();if(!every||fresh)return false;if(m.snooze&&m.snooze>today())return false;const anchor=m.at||m.start;if(!anchor)return false;return diff(anchor,today())>=every}
function backupCard(){if(!backupDue())return"";const m=bakMeta(),txt=m.at?`距离上次把记录存到文件已经 ${diff(m.at,today())} 天。`:"记录还只在这台手机里。";return `<div class="card" style="background:#fff1d6"><h2>该备份了</h2><p style="margin:0">${txt}如果清掉了离线数据，只有存进「文件」的备份能找回来。iPhone 不能在后台自己写文件，点一下即可。</p><div class="row" style="margin-top:10px"><button class="btn" onclick="backupData()">保存到文件</button><button class="btn soft" onclick="snoozeBak()">3天后再说</button></div></div>`}
function snoozeBak(){const m=bakMeta();m.snooze=addDays(3);setBakMeta(m);render(true);toast("3 天后再提醒")}
function setEvery(n){const m=bakMeta();m.every=n;setBakMeta(m);render(true);toast(n?`每 ${n} 天提醒一次`:"已关闭自动提醒")}
function markBak(){const m=bakMeta();m.at=today();m.snooze="";if(!m.start)m.start=today();setBakMeta(m)}
function bakPanel(){const m=bakMeta(),every=backupEvery(),when=m.at?("上次存到文件："+m.at):"还没有存到文件",chip=(n,t)=>`<span class="chip ${every==n?"on":""}" onclick="setEvery(${n})">${t}</span>`;return `<p class="sub" style="margin-top:0">记录保存在这台${dbReady?"手机的 SQLite":idb?"手机":"浏览器"}里，不会上传。清掉网站数据或删掉主屏幕图标后，手机里的记录会消失。打开应用时，如果距离上次保存超过设定天数，会提醒你把全部记录存进 iPhone「文件」，可以放进 iCloud。</p><p class="sub">${when}</p><div class="seg">${chip(3,"每3天")}${chip(7,"每7天")}${chip(0,"不提醒")}</div><div class="row" style="margin-top:10px"><button class="btn" onclick="backupData()">保存到文件</button><button class="btn soft" onclick="pickImport()">导入记录</button></div><button class="btn soft" style="margin-top:10px" onclick="sheetSnaps()">恢复本机副本</button><p class="sub">本机副本只防误删，和记录存在同一处。清掉数据后副本也没了。</p><button class="btn ghost" style="margin-top:10px" onclick="resetDemo()">恢复示例数据</button>`}
function keepSnap(){if(!idb||fresh)return;clearTimeout(keepSnap.t);keepSnap.t=setTimeout(async()=>{try{let arr=[];try{arr=JSON.parse(await idbGet("snaps")||"[]")}catch(e){}arr=Array.isArray(arr)?arr.filter(x=>x&&x.d!==today()):[];arr.push({d:today(),S:JSON.parse(JSON.stringify(S)),F:JSON.parse(JSON.stringify(F))});while(arr.length>3)arr.shift();try{await idbPut("snaps",JSON.stringify(arr))}catch(e){const slim=arr.slice(-2).map(x=>({d:x.d,S:x.S,F:(x.F||[]).map(f=>{const y=Object.assign({},f);y.imgs=[];return y})}));try{await idbPut("snaps",JSON.stringify(slim))}catch(e2){}}}catch(err){}},1500)}
async function sheetSnaps(){let arr=[];try{arr=JSON.parse(await idbGet("snaps")||"[]")}catch(e){}if(!idb){toast("当前环境没有本机副本");return}if(!Array.isArray(arr)||!arr.length){toast("还没有本机副本，记一笔后会自动留下");return}sheet("本机副本",arr.slice().reverse().map(x=>`<div class="row" style="padding:8px 0"><span style="flex:1">${x.d}</span><button class="btn soft sm" onclick="restoreSnap('${x.d}')">恢复</button></div>`).join("")+'<p class="sub">这些副本和记录在同一台手机里。清掉网站数据后会一起消失。</p>')}
function restoreSnap(d){idbGet("snaps").then(raw=>{let arr=[];try{arr=JSON.parse(raw||"[]")}catch(e){}const x=arr.find(i=>i.d===d);if(!x){toast("找不到这份副本");return}if(!confirm("用 "+d+" 的副本覆盖现在的记录？"))return;S=x.S;F=x.F||[];fresh=false;save();saveF();closeSheet();render();toast("已恢复 "+d+" 的副本")}).catch(()=>toast("读取副本失败"))}
function downloadBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
function pickImport(){let el=$("imp");if(!el){el=document.createElement("input");el.type="file";el.id="imp";el.accept="application/json,.json";el.onchange=()=>restoreData(el);document.body.appendChild(el)}el.click()}
async function backupData(){
  const blob=new Blob([JSON.stringify({v:1,exported:today(),S,F})],{type:"application/json"});
  const name="宝贝守护备份-"+today()+".json";
  const file=new File([blob],name,{type:"application/json"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name});
      markBak();
      if(tab==="today"||tab==="me")render(true);
      toast("备份已交出，请确认选了「存储到文件」");
      return;
    }
  }catch(e){
    if(e&&e.name==="AbortError")return;
  }
  downloadBlob(blob,name);
  markBak();
  if(tab==="today"||tab==="me")render(true);
  toast("已开始下载，请到「文件」里确认这份备份");
}
function restoreData(inp){
  const f=inp.files&&inp.files[0];inp.value="";if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.S)throw 0;if(!confirm("用这份备份覆盖这台手机上的记录？"))return;hydrate(JSON.stringify(o.S),JSON.stringify(o.F||[]));fresh=false;save();saveF();markBak();render();toast("已恢复备份")}catch(e){toast("无法读取这份备份")}};
  r.readAsText(f);
}
function hydrate(stateRaw,foodRaw){
  try{S=JSON.parse(stateRaw||"null")}catch(e){S=null}
  try{F=JSON.parse(foodRaw||"[]")}catch(e){F=[]}
  const cancer=S&&(S.mrd||(S.meds&&S.meds.some(m=>/PD-1|化疗|免疫|胸腺|MRD/.test((m.n||"")+(m.c||"")))));
  if(!S||cancer){S=demo();fresh=true;F=[{id:1,d:today(),t:"08:10",meal:"早餐",txt:"小米粥半碗、蒸蛋（示例）",foods:["鸡蛋","杂粮主食"],pro:10,imgs:[]}]}
  ["exams","meds","reacts","intol","logs","appt","labs","kicks","bp","doses","bloods","ctxs","notes"].forEach(k=>S[k]=S[k]||[]);S.risk=S.risk||{};S.preg=S.preg||{lmp:"",due:"",name:""};S.bag=S.bag||{};if(S.remindOn==null)S.remindOn=true;
}
(async()=>{
  let stateRaw=lsGet(LS),foodRaw=lsGet(LSF);
  try{
    await dbInit();
    if(dbReady){
      const ds=await dbGet("state"),df=await dbGet("food");
      if(ds)stateRaw=ds;
      if(df!=null)foodRaw=df;
    }
  }catch(e){dbReady=false}
  if(!dbReady){
    try{
      idb=await idbOpen();
      const ds=await idbGet("state"),df=await idbGet("food");
      if(ds)stateRaw=ds;
      if(df!=null)foodRaw=df;
      if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    }catch(e){idb=null}
  }
  hydrate(stateRaw,foodRaw);
  if(!fresh){const m=bakMeta();if(!m.start){m.start=today();setBakMeta(m)}}
  if(dbReady||idb){save();saveF()}
  booting=false;
  render();
  scheduleReminders();
  if(securePage()&&"serviceWorker"in navigator){
    navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(async()=>{
      const cache=await caches.open("baobei-v7");
      let hit=await cache.match("./")||await cache.match("index.html");
      if(!hit){
        const res=await fetch("index.html",{cache:"reload"});
        if(res.ok){await cache.put("./",res.clone());await cache.put("index.html",res.clone());hit=true}
      }
      offlineOK=!!hit;
      if(tab==="today")render(true);
    }).catch(()=>{});
  }
})();
